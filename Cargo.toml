[package]
name = "phantomqa"
version = "0.1.0"
edition = "2024"
description = "AI agents test Android apps on an emulator and report what breaks"
license = "MIT"
repository = "https://github.com/DryBearr/PhantomQA"
readme = "README.md"
keywords = ["android", "testing", "mcp", "qa", "adb"]
categories = ["development-tools::testing", "command-line-utilities"]

[dependencies]
getrandom = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tiny_http = "0.12.0"
